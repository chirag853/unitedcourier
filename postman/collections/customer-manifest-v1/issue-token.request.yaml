$kind: http-request
method: POST
url: '{{base_url}}/api/v1/auth/token'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "customer@example.com",
      "password": "secret123",
      "name": "api"
    }
